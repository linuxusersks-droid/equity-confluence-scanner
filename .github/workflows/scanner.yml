name: Fyers 5m VWAP Scanner

on:
  workflow_dispatch:   # Manual test aur cron-job.org webhook ke liye
  schedule:
    - cron: '*/5 3-9 * * 1-5'   # Backup schedule (Mon-Fri, 08:30 - 15:25 IST)

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install fyers-apiv3 pyotp pandas requests

      - name: Cache Fyers Token & Alert State
        uses: actions/cache@v4
        with:
          path: |
            /tmp/fyers_access_token.txt
            /tmp/alerted_stocks.txt
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Run Scanner
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_key: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_ID: ${{ secrets.FYERS_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

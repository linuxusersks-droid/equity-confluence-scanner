name: Backtest Runner

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Kaunsi strategy chalani hai'
        required: true
        default: 'backtest_orb.py'
        type: choice
        options:
          - backtest_orb.py
          - backtest_5m_vwap.py
      days:
        description: 'Kitne din ka backtest (default 180)'
        required: false
        default: '180'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install fyers-apiv3 pyotp pandas numpy requests

      - name: Run Backtest
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_ID: ${{ secrets.FYERS_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKTEST_DAYS: ${{ inputs.days }}
        run: python ${{ inputs.strategy }}

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_out/
          
